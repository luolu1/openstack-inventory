services:
  openstack-inventory:
    build: .
    ports:
      - "${INVENTORY_PORT:-8000}:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      OPENSTACK_PLATFORMS_FILE: /etc/openstack-inventory/platforms.json
      OPENSTACK_REGION_NAME: "${OPENSTACK_REGION_NAME:-}"
    volumes:
      - "${OPENSTACK_CONFIG_DIR:-/dev/null}:/etc/openstack-inventory:ro"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
